{% extends "base.html" %}

{% block title %}Write a Review{% endblock %}

{% block body %}
<div class="container">
  <h2>Write a Review for "{{ title }}"</h2>
  <form method="POST">
    <label>Review Title:</label><br>
    <input type="text" name="review_title" required><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="4" required></textarea><br><br>

     <button type="submit" name="button" value="Submit">Classify the Review</button>
    <br><br>
    <button type="submit" name="button" value="Save">Save</button>
  </form>
</div>
{% endblock %}
