{% extends "base.html" %}

{% block title %}Review Result{% endblock %}

{% block body %}
<div class="container">
  <h2>Review Result for "{{ title }}"</h2>
  <p><strong>Review Title:</strong> {{ review_title }}</p>
  <p><strong>Description:</strong> {{ description }}</p>
  <p><strong>Sentiment:</strong> 
    {% if label == 1 %}
      <span style="color: green;">Recommended</span>
    {% else %}
      <span style="color: red;">Not Recommended</span>
    {% endif %}
  </p>
</div>
{% endblock %}
